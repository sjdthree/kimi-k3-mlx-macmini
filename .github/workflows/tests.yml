name: tests

# The checkpoint-free half of the suite: MXFP4 decode against compressed-tensors, the
# fused Metal matvec, the MLA latent cache, quantised latent storage, KDA prefill memory,
# an end-to-end run on a 2.7 MB synthetic model, per-token logging, and the OpenAI /v1
# conformance checks against a mock engine. Expected: 10 passed, 10 skipped, 0 failed.
#
# The ten suites that compare against the real 1.42 TiB checkpoint skip themselves unless
# K3_CKPT is set, which no runner can satisfy. test_full_parity is slow and is opt-in
# via `tests/run_all.py --include-slow`.
#
# Runners must be Apple Silicon -- mlx has no x86 build. macos-latest is arm64; the
# explicit uname guard below fails loudly rather than silently if that ever changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the tree.
permissions:
  contents: read

# A newer push supersedes an in-flight run rather than queueing another macOS job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    # macOS minutes bill at 10x on private repos, and a hung job would otherwise run for
    # the 6-hour default. The suite takes about a minute.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Verify the runner is Apple Silicon
        run: |
          test "$(uname -m)" = "arm64" || { echo "mlx needs arm64; got $(uname -m)"; exit 1; }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-test.txt -e '.[dev]'

      - name: Show versions
        run: |
          python -c "import mlx.core as mx; print('mlx  ', getattr(mx, '__version__', 'ok'))"
          python -c "import numpy, torch, tiktoken; print('numpy', numpy.__version__); print('torch', torch.__version__)"

      - name: Run the suite
        run: python tests/run_all.py

      - name: Recompute the evidence ledger from the committed logs
        run: python tools/summarize_evidence.py
